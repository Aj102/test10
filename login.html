<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Student Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:ital,wght@0,100..900;1,100..900&family=Belanosima:wght@400;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="logstyle.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="transition.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>
<body class="page-login">

<section id="form">
    <div id="tlog">
        <h1>PORTAL LOGIN</h1>
        <img src="credential.png" alt="Student credentials">
        <p>Enter your credentials to continue</p>
    </div>

    <h4 id="stname">EMAIL ADDRESS</h4>
    <div id="user">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" autocomplete="username"
               placeholder="you@example.com" required>
    </div>

    <h4 id="stps">PASSWORD</h4>
    <div id="pss">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="pass" autocomplete="current-password"
               placeholder="Password" required>
    </div>

    <div id="fp">
        <p class="fp-label">New here? Sign up as</p>
        <div class="fp-links">
            <a href="Signup.html"><i class="fa-solid fa-user-graduate"></i>Student</a>
            <a href="ParentSignup.html"><i class="fa-solid fa-user-group"></i>Parent</a>
            <a href="TeacherSignup.html"><i class="fa-solid fa-chalkboard-user"></i>Teacher</a>
        </div>
    </div>

    <p id="loginMessage" role="status" aria-live="polite"></p>

    <div id="btn">
        <button id="loginButton" type="button">LOG IN PORTFOLIO</button>
    </div>
</section>

<script>
    const STUDENT_EMAIL_PATTERN = /^[a-z0-9._%+-]+@fatima\.edu\.ph$/i;

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("pass");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    async function handleLogin() {
        message.textContent = "";

        if (!usernameInput.value.trim() || !passwordInput.value) {
            message.textContent = "Enter your email and password.";
            return;
        }

        loginButton.disabled = true;

        try {
            await loginAccount(usernameInput.value, passwordInput.value);
            const signedInProfile = await getMyProfile();
            const role = (signedInProfile && signedInProfile.role) || "student";
            const accountEmail = String(
                (signedInProfile && signedInProfile.email) || usernameInput.value
            ).trim().toLowerCase();

            if (role !== "parent" && !STUDENT_EMAIL_PATTERN.test(accountEmail)) {
                await logoutAccount();
                message.textContent = "Student and teacher accounts require an @fatima.edu.ph email. Ask your adviser to fix your account email.";
                loginButton.disabled = false;
                return;
            }

            if (role === "parent") {
                window.location.href = "Parent.html";
            } else if (role === "teacher") {
                window.location.href = "Teacher.html";
            } else {
                window.location.href = "Welcome.html";
            }
        } catch (error) {
            message.textContent = error.message || "Login failed.";
            loginButton.disabled = false;
        }
    }

    loginButton.addEventListener("click", handleLogin);

    passwordInput.addEventListener("keydown", event => {
        if (event.key === "Enter") handleLogin();
    });
</script>

</body>
</html>
